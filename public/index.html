<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Guardaroba</title>
</head>
<body>
    <div id="root">
        <section>
            <header>
                <!-- Cambiado de name="logo" a class="logo" -->
                <div class="logo">
                    <span id="logo"></span>    
                    <span id="title">Guardaroba</span>
                </div>
            </header>
            <!-- Corregidos los espacios en los id y cambiados a clases o separados -->
            <div id="form_login" class="flex">
                <div id="content" class="full">
                    <div id="intro">
                        <p>Tu armario, Tu orden</p>
                        <h1>Crea tu Guardarropa</h1>
                        <p>Bienvenido a Guardaroba, tu aplicación de gestión de ropa. Inicia sesión o regístrate para comenzar a organizar tu guardarropa.</p>
                    </div> 
                    <div id="buttons_login_register" class="flex">
                        <button id="login">Login</button>
                        <button id="register">Register</button>
                    </div>
                    <!-- Formulario de inicio de sesión -->
                    <form id="iniciar_sesion">
                        <div class="form-group">
                            <label for="username">Nombre:</label>
                            <input type="text" id="username" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                    </form>
                    <!-- Formulario de registro -->
                    <form id="registrarse">
                        <div class="form-group">
                            <label for="new_email">Correo electrónico:</label>
                            <input type="email" id="new_email" name="new_email" required>
                        </div>
                        <div class="form-group">
                            <label for="new_password">Contraseña:</label>
                            <input type="password" id="new_password" name="new_password" required>
                        </div>
                    </form>
                    <p></p>
                </div>
            </div>
            <footer>
                <p>&copy; 2026 Guardaroba.</p>
            </footer>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
