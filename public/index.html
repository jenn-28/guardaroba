<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Guardaroba</title>
</head>
<body>
    <div id="root">
        <section>
            <header>
                <!-- Cambiado de name="logo" a class="logo" -->
                <div class="logo">
                    <span id="logo"></span>    
                    <span id="title">Guardaroba</span>
                </div>
            </header>
            <!-- Corregidos los espacios en los id y cambiados a clases o separados -->
            <div id="form_login" class="flex">
                <div id="content" class="full">
                    <div id="intro"></div> 
                    <div id="buttons">
                        <button id="login">Login</button>
                        <button id="register">Register</button>
                    </div>
                    <form id="iniciar_sesion"></form>
                    <form id="registrarse"></form>
                    <p></p>
                </div>
            </div>
            <footer>
                <p>&copy; 2026 Guardaroba.</p>
            </footer>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
